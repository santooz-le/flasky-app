{% extends "base.html" %}

{% block content %}

<h1 style="font-weight: 400; margin-top: 20px; margin-bottom: 5px;">
    {% if name %}
        Hello, {{ name }}!
    {% else %}
        Hello, Stranger!
    {% endif %}
</h1>

{% if name %}
<p style="font-size: 14px; margin-bottom: 20px;">
    Pleased to <a href="/" style="color: #337ab7; text-decoration: none;">meet you</a>!
</p>
{% endif %}

<form method="POST" style="margin-top: 15px;">
    <div style="margin-bottom: 10px;">
        <label style="font-weight: 700; font-size: 14px; color: #333; display: block; margin-bottom: 5px;">
            What is your name?
        </label>
        <input type="text" class="form-control" name="name" value="{{ name if name else '' }}">
    </div>
    <button type="submit" style="border: 1px solid #ccc; background: #fff; color: #333; padding: 6px 12px; border-radius: 4px; font-size: 14px; margin-top: 5px;">
        Submit
    </button>
</form>

{% endblock %}
