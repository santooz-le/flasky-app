<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 050.B</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <style>
        .navbar-brand { color: #999 !important; font-weight: normal; }
        .navbar-brand strong { color: #fff; font-weight: bold; }
        .nav-link { color: #ccc !important; font-size: 0.9rem; }
        .nav-link:hover { color: #fff !important; }
        .timestamp { font-size: 0.9rem; }
        .timestamp p { margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2">
        <!-- Trocado container-fluid por container para alinhar com o gabarito -->
        <div class="container">
            <span class="navbar-brand me-4 fs-6">
                Avaliação contínua: <strong>Aula 050.B</strong>
            </span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Trocado container-fluid por container para dar as margens laterais corretas -->
    <div class="container mt-5">
        {% block content %}{% endblock %}

        <!-- Rodapé sem cores amarelas -->
        <div class="timestamp mt-5">
            <p>The local date and time is {{ now.strftime('%B %d, %Y %-I:%M %p') }}.</p>
            <p id="timeago-text"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const serverTime = moment("{{ now.strftime('%Y-%m-%d %H:%M:%S') }}", "YYYY-MM-DD HH:mm:ss");
        document.getElementById('timeago-text').textContent = 'That was ' + serverTime.fromNow() + '.';
    </script>
</body>
</html>
