<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 050.B</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <style>
        body { font-size: 0.9rem; }
        .navbar-brand { color: #999 !important; font-style: italic; }
        .navbar-brand strong { color: #fff; font-style: normal; }
        .nav-link { color: #ccc !important; }
        .nav-link:hover { color: #fff !important; }
        .timestamp { color: #888; font-size: 0.82rem; margin-top: 2rem; }
        .timestamp a { color: #e67e22; text-decoration: none; }
        .timestamp a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2">
        <div class="container-fluid px-4">
            <span class="navbar-brand me-4">
                Avaliação contínua: <strong>Aula 050.B</strong>
            </span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mt-4">
        {% block content %}{% endblock %}

        <!-- Rodapé com data/hora -->
        <div class="timestamp mt-4">
            <p id="datetime-text">The local date and time is <strong>{{ now.strftime('%B %d, %Y %-I:%M %p') }}</strong>.</p>
            <p><a href="#" id="timeago-text"></a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Calcula o "That was X ago" usando moment.js
        const serverTime = moment("{{ now.strftime('%Y-%m-%d %H:%M:%S') }}", "YYYY-MM-DD HH:mm:ss");
        document.getElementById('timeago-text').textContent = 'That was ' + serverTime.fromNow() + '.';
    </script>
</body>
</html>
