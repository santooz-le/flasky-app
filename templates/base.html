<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flasky</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #333; }

        /* Bootstrap 3 container widths para centralizar igual ao professor */
        @media (min-width: 768px)  { .container { max-width: 750px !important; } }
        @media (min-width: 992px)  { .container { max-width: 970px !important; } }
        @media (min-width: 1200px) { .container { max-width: 1170px !important; } }

        .navbar-dark { background-color: #222 !important; }
        .navbar-brand { color: #9d9d9d !important; font-size: 18px; text-decoration: none; font-weight: normal; }
        .navbar-brand:hover { color: #fff !important; }
        .nav-link { color: #9d9d9d !important; font-size: 14px; }
        .nav-link:hover { color: #fff !important; }

        hr { border-top: 1px solid #eee; opacity: 1; }
        .form-control { border-radius: 4px; border: 1px solid #ccc; height: 34px; padding: 6px 12px; font-size: 14px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark py-0" style="height: 50px;">
        <div class="container">
            <a class="navbar-brand me-4" href="/" style="color: #9d9d9d !important;">Avaliação contínua: <strong>Aula 060</strong></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 20px;">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
