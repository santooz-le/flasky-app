<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 050.B</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <style>
        /* Simulando o visual exato do Bootstrap 3 (Flask-Bootstrap) */
        body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #333; }
        .navbar-dark { background-color: #222 !important; border-color: #080808; }
        .navbar-brand { color: #999 !important; font-size: 18px; padding-left: 0; }
        .navbar-brand strong { color: #fff; font-weight: bold; }
        .nav-link { color: #999 !important; font-size: 14px; }
        .nav-link:hover { color: #fff !important; }
        
        /* Ajustando os inputs para ficarem iguazinhos aos do professor */
        .form-control, .form-select { border-radius: 4px; border: 1px solid #ccc; height: 34px; padding: 6px 12px; font-size: 14px; }
        hr { border-top: 1px solid #eee; margin-top: 20px; margin-bottom: 20px; border-bottom: 0; opacity: 1; }
        
        /* Ajuste do rodapé */
        .timestamp { font-size: 14px; margin-top: 30px; }
        .timestamp p { margin-bottom: 5px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark py-0" style="height: 50px;">
        <div class="container">
            <span class="navbar-brand me-4">
                Avaliação contínua: <strong>Aula 050.B</strong>
            </span>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 20px;">
        {% block content %}{% endblock %}

        <div class="timestamp">
            <p>The local date and time is {{ now.strftime('%B %d, %Y %-I:%M %p') }}.</p>
            <p id="timeago-text"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const serverTime = moment("{{ now.strftime('%Y-%m-%d %H:%M:%S') }}", "YYYY-MM-DD HH:mm:ss");
        document.getElementById('timeago-text').textContent = 'That was ' + serverTime.fromNow() + '.';
    </script>
</body>
</html>
