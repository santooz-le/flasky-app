{% extends "base.html" %}

{% block content %}
<div style="margin-top: 50px; display: flex; justify-content: center;">
    <div style="width: 100%; max-width: 400px; border: 1px solid #ddd; padding: 20px; border-radius: 4px; background-color: #fff;">
        <h3 style="margin-top: 0; margin-bottom: 20px; font-weight: 500; font-size: 24px;">Login:</h3>
        
        <form method="POST">
            <div style="margin-bottom: 15px;">
                <input type="text" class="form-control" name="usuario" placeholder="Usuário ou e-mail">
            </div>
            <div style="margin-bottom: 15px;">
                <input type="password" class="form-control" name="senha" placeholder="Informe a sua senha">
            </div>
            <button type="submit" style="background-color: #337ab7; border-color: #2e6da4; color: #fff; border-radius: 4px; padding: 6px 12px; font-size: 14px; border: 1px solid transparent;">Enviar</button>
        </form>
    </div>
</div>
{% endblock %}
